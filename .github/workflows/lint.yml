name: Lint

on:
  # push only on the long-lived branches: on a PR branch, push + pull_request would both fire
  # and lint every commit twice.
  push:
    branches: [main, dev, opensource]
  pull_request:
    branches: [main, dev, opensource]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.4
    env:
      # go's VCS-stamping (`go build`/`go vet`) fails with "error obtaining
      # VCS status: exit status 128" inside this container — git safe.directory
      # mismatch between the checkout step's user and the linter's. Not needed
      # for CI builds anyway (per go's own suggested fix).
      GOFLAGS: -buildvcs=false
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated manifests and Helm chart are in sync
        run: |
          apt-get update && apt-get install -y make shellcheck
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make verify-chart

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Lint shell scripts and Dockerfiles
        run: make lint-scripts

      - name: Lint Helm chart and validate rendered manifests
        run: make lint-chart

      - name: Check for reachable vulnerabilities
        run: make vulncheck

      - name: Check third-party licences
        if: github.actor != 'dependabot[bot]'
        run: make license-check

      # Dependabot can't regenerate THIRD_PARTY_NOTICES.txt; dependabot-notices.yml commits it.
      - name: Check third-party licence types (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: make license-types-check
