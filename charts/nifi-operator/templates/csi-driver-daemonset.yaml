{{- if .Values.csiDriver.enabled }}
# Deploys the TLS CSI node plugin on every node - it must run wherever a NiFi pod might be
# scheduled, unlike the operator's own manager, which runs as a single Deployment. Uses only
# upstream Kubernetes DaemonSet/hostPath/securityContext fields - nothing OKD- or
# distro-specific (see docs/csi-driver-platform-notes.md for what a specific platform's
# admission policy needs to additionally grant to let a privileged, hostPath-mounting DaemonSet
# like this one actually run there).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nifi-operator.fullname" . }}-csi-driver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nifi-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi-driver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nifi-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: csi-driver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nifi-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: csi-driver
    spec:
      serviceAccountName: {{ include "nifi-operator.fullname" . }}-csi-driver
      containers:
        - name: csi-driver
          image: {{ include "nifi-operator.image" (dict "image" .Values.csiDriver.image "defaultTagPrefix" "nifi-operator-csi-driver" "root" .) | quote }}
          imagePullPolicy: {{ .Values.csiDriver.image.pullPolicy }}
          args:
            - --csi-endpoint=unix:///csi/csi.sock
            - --cluster-domain={{ .Values.clusterDomain }}
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: kubernetes.default.svc
            # Reported by NodeGetInfo as this plugin instance's CSI NodeID - deliberately NOT
            # the container's own hostname (which is the pod's name, not the node's).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # The driver only creates its socket and writes certificate files into kubelet-owned
            # directories (no mount syscalls), so it runs as root but unprivileged. On
            # SELinux-enforcing nodes (OpenShift) writing there needs csiDriver.privileged: true.
            {{- if .Values.csiDriver.privileged }}
            privileged: true
            {{- else }}
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            {{- end }}
            # Writes only into its hostPath/volume mounts (/csi, the kubelet pods dir).
            readOnlyRootFilesystem: true
          ports:
            # Served by the livenessprobe sidecar (same pod network namespace), declared here
            # because the probe below restarts this container, not the sidecar.
            - name: healthz
              containerPort: 9808
          # The sidecar answers /healthz by calling this driver's CSI Probe RPC over the socket,
          # so a hung or dead gRPC server gets the container restarted instead of silently
          # failing every NiFi pod's volume mount on this node.
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.csiDriver.resources | nindent 12 }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              # Sees pod directories kubelet creates after the driver started; never pushes mounts
              # back to the host (it makes none).
              mountPropagation: HostToContainer
        - name: node-driver-registrar
          # Upstream sidecar, not our own code - registers this driver's socket with kubelet so
          # NodePublishVolume actually gets called. Version pinned deliberately.
          image: "{{ .Values.csiDriver.nodeDriverRegistrar.image }}"
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/tls.nifi.ksolves.com/csi.sock
            - --http-endpoint=:9809
          securityContext:
            # SEC-14: can't be runAsNonRoot. It writes its registration socket into
            # /var/lib/kubelet/plugins_registry (registration-dir below), which kubelet creates
            # root:root 0750 - confirmed live that a non-root UID gets "permission denied" there.
            # Every reference CSI driver (AWS EBS, GCP PD, ...) runs this same upstream sidecar as
            # root for the same reason. runAsUser is explicit so that intent isn't left to the
            # image's own default user.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: registrar-hz
              containerPort: 9809
              protocol: TCP
          # The registrar re-registers with kubelet when restarted; /healthz fails when
          # registration was lost.
          livenessProbe:
            httpGet:
              path: /healthz
              port: registrar-hz
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.csiDriver.nodeDriverRegistrar.resources | nindent 12 }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          # Upstream sidecar: turns the CSI Probe RPC into the HTTP endpoint kubelet can probe.
          image: "{{ .Values.csiDriver.livenessProbe.image }}"
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.csiDriver.livenessProbe.resources | nindent 12 }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/tls.nifi.ksolves.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
{{- end }}
