# RBAC for the TLS CSI node plugin - deliberately separate from the main
# operator's ServiceAccount/ClusterRole (config/rbac), since this is a distinct component with
# its own, much narrower needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nifi-operator-csi-driver
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nifi-operator-csi-driver-role
rules:
  # get, not list/watch: the driver only ever reads one specific object by name, resolved from a
  # mounting pod's own volume attributes (see internal/csidriver/node.go) - it never enumerates.
  #
  # No Secret access here. RBAC resourceNames can't match a name pattern, so instead of `get` on
  # every Secret the operator grants this ServiceAccount `get` on each TLS cluster's CA Secret
  # only, through a per-cluster Role and RoleBinding (<cluster>-csi-ca-reader). The operator is
  # told this ServiceAccount via --csi-driver-service-account (config/manager/manager.yaml).
  #
  # nifinodegroups: a node group may be its own NiFiNodeGroup object instead of an inline
  # spec.nodeGroups entry.
  - apiGroups: ["nifi.ksolves.com"]
    resources: ["nificlusters", "nifinodegroups"]
    verbs: ["get"]
  # Pod + StatefulSet `get`: before issuing a certificate the driver verifies the mounting pod is
  # controlled (by UID) by the node group's StatefulSet, which is controlled by the NiFiCluster -
  # see verifyPodOwnership in internal/csidriver/node.go. Same get-by-name-only shape as above.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nifi-operator-csi-driver-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nifi-operator-csi-driver-role
subjects:
  - kind: ServiceAccount
    name: nifi-operator-csi-driver
    namespace: system
