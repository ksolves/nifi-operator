# This rule is not used by the project nifi-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to nifi.ksolves.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nifi-operator
    app.kubernetes.io/managed-by: kustomize
  name: nificluster-viewer-role
rules:
- apiGroups:
  - nifi.ksolves.com
  resources:
  - nificlusters
  - nifinodegroups
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nifi.ksolves.com
  resources:
  - nificlusters/status
  - nifinodegroups/status
  verbs:
  - get
- apiGroups:
  - nifi.ksolves.com
  resources:
  - nifinodegroups/scale
  verbs:
  - get
