# NiFi login read from a user-managed Secret - for anything beyond throwaway test clusters.
# Create the Secret first (keys must be "username" and "password", password >= 12 characters):
#
#   oc -n nifi-operator create secret generic nifi-auth-secret-login \
#     --from-literal=username=admin \
#     --from-literal=password="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
#
# The webhook warns (but admits) if the Secret doesn't exist yet, so GitOps tools or secret
# syncers (External Secrets, Vault) can create it alongside this CR. Rotating the Secret's
# contents rolls the pods onto the new login automatically.
apiVersion: nifi.ksolves.com/v1alpha1
kind: NiFiCluster
metadata:
  name: nifi-auth-secret
  namespace: nifi-operator
spec:
  image:
    repository: apache/nifi
    # Pin by digest outside throwaway tests: see nifi-auth-literal.yaml.
    tag: 2.12.0
  # Private registry? Add its pull Secret:
  # imagePullSecrets:
  #   - name: <pull-secret>
  authentication:
    singleUser:
      secretName: nifi-auth-secret-login
  nodeGroups:
    - name: default
      replicas: 1
      storage: 1Gi
      storageClassName: standard
      tls:
        enabled: true
