<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reconcile-flow-title reconcile-flow-desc" id="d-04-reconcile-flow-root">
        <title id="reconcile-flow-title">How a reconcile works</title>
        <desc id="reconcile-flow-desc">Flowchart of one NiFiCluster reconcile: a paused cluster only refreshes status, otherwise the operator prunes removed node groups, sets up security prerequisites, reconciles each node group, exposes the cluster, polls NiFi, writes status, runs follow-ups and requeues.</desc>
        <defs>
      <style>#d-04-reconcile-flow-root { --color-paper:   #fafaf9;
      --color-ink:     #212121;
      --color-muted:   #5c636a;
      --color-accent:  #c32f3c;
      --font-sans:     'Manrope', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-04-reconcile-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-04-reconcile-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-04-reconcile-flow-root .subtitle { font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem; }
      #d-04-reconcile-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="d-04-reconcile-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c636a"/></marker>
          <marker id="d-04-reconcile-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c32f3c"/></marker>
          <marker id="d-04-reconcile-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e49e0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafaf9"/>

        <!-- ============ Arrows (behind nodes) ============ -->
        <!-- Trigger -> Paused? -->
        <line x1="320" y1="96" x2="320" y2="128" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Paused? YES -> refresh status only -->
        <line x1="420" y1="184" x2="560" y2="184" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Paused? NO -> prune -->
        <line x1="320" y1="240" x2="320" y2="296" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Prune -> prerequisites -->
        <line x1="440" y1="344" x2="560" y2="344" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Prerequisites -> per node group -->
        <line x1="800" y1="344" x2="920" y2="344" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Per node group -> exposure -->
        <line x1="1040" y1="392" x2="1040" y2="456" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Exposure -> poll + status -->
        <line x1="920" y1="504" x2="800" y2="504" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Poll + status -> follow-ups -->
        <line x1="560" y1="504" x2="440" y2="504" stroke="#5c636a" stroke-width="1.2" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <!-- Follow-ups -> requeue loop back to trigger (dashed) -->
        <path d="M200 504 H128 A8 8 0 0 1 120 496 V76 A8 8 0 0 1 128 68 H200" fill="none" stroke="#5c636a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-04-reconcile-flow-arrow)"/>

        <!-- ============ Arrow labels ============ -->
        <rect x="474" y="164" width="32" height="12" rx="2" fill="#fafaf9"/>
        <text x="490" y="173" fill="#67707a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="328" y="262" width="24" height="12" rx="2" fill="#fafaf9"/>
        <text x="340" y="271" fill="#67707a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="56" y="280" width="56" height="12" rx="2" fill="#fafaf9"/>
        <text x="84" y="289" fill="#67707a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REQUEUE</text>

        <!-- ============ Nodes ============ -->
        <!-- Trigger (start oval) -->
        <rect x="200" y="40" width="240" height="56" rx="20" fill="#fafaf9"/>
        <rect x="200" y="40" width="240" height="56" rx="20" fill="#212121" stroke="#212121" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="320" y="64" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Change or requeue</text>
        <text x="320" y="80" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CR · Secret · PVC · NiFiNodeGroup</text>

        <!-- Decision: Paused? -->
        <polygon points="320,128 420,184 320,240 220,184" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="320" y="182" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Paused?</text>
        <text x="320" y="196" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">annotation set</text>

        <!-- End oval: paused path -->
        <rect x="560" y="156" width="240" height="56" rx="20" fill="#fafaf9"/>
        <rect x="560" y="156" width="240" height="56" rx="20" fill="#212121" stroke="#212121" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="680" y="180" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Refresh status only</text>
        <text x="680" y="196" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">poll NiFi · no writes · done</text>

        <!-- 01 Prune removed node groups -->
        <rect x="200" y="296" width="240" height="96" rx="6" fill="#fafaf9"/>
        <rect x="200" y="296" width="240" height="96" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <rect x="208" y="304" width="24" height="12" rx="2" fill="none" stroke="#212121" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="220" y="313" fill="#212121" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">01</text>
        <text x="320" y="338" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Prune removed node groups</text>
        <text x="320" y="356" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">decommission → offload → remove</text>
        <text x="320" y="369" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">then delete StatefulSet</text>

        <!-- 02 Cluster prerequisites -->
        <rect x="560" y="296" width="240" height="96" rx="6" fill="#fafaf9"/>
        <rect x="560" y="296" width="240" height="96" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <rect x="568" y="304" width="24" height="12" rx="2" fill="none" stroke="#212121" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="580" y="313" fill="#212121" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">02</text>
        <text x="680" y="338" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Security + coordination</text>
        <text x="680" y="356" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TLS CA · CSI access · login Secrets</text>
        <text x="680" y="369" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RBAC · sensitive-props key</text>
        <text x="680" y="382" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">coordination backend immutable</text>

        <!-- 03 Per node group (focal) -->
        <rect x="920" y="296" width="240" height="96" rx="6" fill="#fafaf9"/>
        <rect x="920" y="296" width="240" height="96" rx="6" fill="#c32f3c" stroke="#c32f3c" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="928" y="304" width="24" height="12" rx="2" fill="none" stroke="#c32f3c" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="940" y="313" fill="#c32f3c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
        <text x="1040" y="338" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Per node group</text>
        <text x="1040" y="356" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ConfigMap · StatefulSet · Services</text>
        <text x="1040" y="369" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PDB · PVC resize / retention</text>
        <text x="1040" y="382" fill="#c32f3c" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fail-safe: errors collected</text>

        <!-- 04 Exposure -->
        <rect x="920" y="456" width="240" height="96" rx="6" fill="#fafaf9"/>
        <rect x="920" y="456" width="240" height="96" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <rect x="928" y="464" width="24" height="12" rx="2" fill="none" stroke="#212121" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="940" y="473" fill="#212121" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">04</text>
        <text x="1040" y="504" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Exposure</text>
        <text x="1040" y="522" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Service type · Route · HTTPRoute</text>

        <!-- 05 Poll NiFi + write status -->
        <rect x="560" y="456" width="240" height="96" rx="6" fill="#fafaf9"/>
        <rect x="560" y="456" width="240" height="96" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <rect x="568" y="464" width="24" height="12" rx="2" fill="none" stroke="#212121" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="580" y="473" fill="#212121" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">05</text>
        <text x="680" y="498" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Poll NiFi, write status</text>
        <text x="680" y="516" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">REST API → node states</text>
        <text x="680" y="529" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">status · conditions · events</text>

        <!-- 06 Follow-ups -->
        <rect x="200" y="456" width="240" height="96" rx="6" fill="#fafaf9"/>
        <rect x="200" y="456" width="240" height="96" rx="6" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <rect x="208" y="464" width="24" height="12" rx="2" fill="none" stroke="#212121" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="220" y="473" fill="#212121" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">06</text>
        <text x="320" y="498" fill="#212121" font-size="12" font-weight="600" font-family="'Manrope', system-ui, sans-serif" text-anchor="middle">Follow-ups</text>
        <text x="320" y="516" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">node removal on scale-down</text>
        <text x="320" y="529" fill="#5c636a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PVC resize · NiFiNodeGroup status</text>

        <!-- ============ Legend ============ -->
        <line x1="40" y1="632" x2="1240" y2="632" stroke="#212121" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="652" fill="#5c636a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="668" width="24" height="12" rx="6" fill="#212121" stroke="#212121" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="678" fill="#5c636a" font-size="9" font-family="'Manrope', system-ui, sans-serif">Start / end</text>

        <rect x="200" y="668" width="24" height="12" rx="2" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="232" y="678" fill="#5c636a" font-size="9" font-family="'Manrope', system-ui, sans-serif">Step (numbered in order)</text>

        <polygon points="412,674 424,668 436,674 424,680" fill="#ffffff" stroke="#212121" stroke-width="1"/>
        <text x="448" y="678" fill="#5c636a" font-size="9" font-family="'Manrope', system-ui, sans-serif">Decision</text>

        <rect x="560" y="668" width="24" height="12" rx="2" fill="#c32f3c" stroke="#c32f3c" stroke-width="1" fill-opacity="0.08"/>
        <text x="592" y="678" fill="#5c636a" font-size="9" font-family="'Manrope', system-ui, sans-serif">Focal step: one node group fails without blocking the others</text>

        <line x1="960" y1="674" x2="988" y2="674" stroke="#5c636a" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-04-reconcile-flow-arrow)"/>
        <text x="996" y="678" fill="#5c636a" font-size="9" font-family="'Manrope', system-ui, sans-serif">Requeue at the status interval</text>
      </svg>
